<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f5c4d" />
        <title>Offline · MyMahallah+</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <style>
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #1a1a1a;
                --muted: #5b5b5b;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #121212;
                    --fg: #f2f2f2;
                    --muted: #a8a8a8;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--fg);
                font-family: system-ui, sans-serif;
                padding: 0 16px;
            }
            main {
                max-width: 22rem;
                text-align: center;
            }
            img {
                width: 64px;
                height: 64px;
            }
            h1 {
                font-size: 1.25rem;
                margin: 1rem 0 0.5rem;
            }
            p {
                color: var(--muted);
                line-height: 1.5;
                margin: 0 0 1.5rem;
            }
            button {
                font: inherit;
                padding: 0.625rem 1.25rem;
                border: 0;
                border-radius: 0.5rem;
                background: #0f5c4d;
                color: #fff;
                cursor: pointer;
            }
            button:focus-visible {
                outline: 3px solid #f2c14e;
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/favicon.svg" alt="" />
            <h1>You're offline</h1>
            <p>
                MyMahallah+ needs a connection to load your Mahallah's latest
                data. Check your Wi-Fi or mobile data, then try again.
            </p>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
